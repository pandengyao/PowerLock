name: Feature request
description: 提出新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      placeholder: "我在……场景下，希望……"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
