name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Make scripts executable
        run: chmod +x scripts/*.sh Tests/*.sh Resources/Helper/*.sh

      - name: Smoke check
        run: ./scripts/check.sh

      - name: Helper state machine tests
        run: ./Tests/helper-test.sh

      - name: Upload app
        uses: actions/upload-artifact@v5
        with:
          name: PowerLock-app
          path: build/PowerLock.app
