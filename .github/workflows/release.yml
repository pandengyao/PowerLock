name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Make scripts executable
        run: chmod +x scripts/*.sh Tests/*.sh Resources/Helper/*.sh

      - name: Check tag matches Info.plist
        run: |
          plist_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          if [[ "$plist_version" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $plist_version" >&2
            exit 1
          fi

      - name: Helper state machine tests
        run: ./Tests/helper-test.sh

      - name: Package universal build
        run: |
          VERSION="${GITHUB_REF_NAME#v}" UNIVERSAL=1 ./scripts/package.sh

      - name: Verify artifacts
        run: |
          lipo -info build/PowerLock.app/Contents/MacOS/PowerLock
          cat build/dist/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            build/dist/*.zip
            build/dist/*.dmg

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/dist/*.zip
            build/dist/*.dmg
            build/dist/SHA256SUMS.txt
